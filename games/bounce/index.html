<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>Gravity Bounce</h1>
            <div class="score">Bounces: <span id="bounceCount">0</span></div>
            <div class="instructions">ADHD trap type thing</div>
        </div>
        
        <div class="circle-container">
            <canvas id="bounceCanvas"></canvas>
        </div>
        
        <div class="graph-container">
            <canvas id="ballGraph" width="500" height="100"></canvas>
        </div>

        <div class="controls">
          <div class="button-group">
            <button id="modeToggle">Normal Mode</button>
            <button id="startButton">Start</button>
            <button id="resetButton">Reset</button>
          </div>
          <div class="slider-group">
            <div class="control-group">
              <label for="gravitySlider">Gravity:</label>
              <input type="range" id="gravitySlider" min="0.1" max="1" step="0.1" value="0.5">
            </div>
            <div class="control-group">
              <label for="ballSizeSlider">Ball Size:</label>
              <input type="range" id="ballSizeSlider" min="4" max="20" step="1" value="12">
            </div>
          </div>
        </div>
    </div>
    
    <a href="../../index.html" class="back-link">Back to Main Menu</a>
    
    <script src="bounce.js"></script>
</body>
</html>
