<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Flow Field</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>Particle Flow Field</h1>
            <div class="instructions">Watch particles flow through an interactive vector field!</div>
        </div>
        
        <div class="canvas-container">
            <canvas id="particleCanvas"></canvas>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <button id="startButton">Start</button>
                <button id="resetButton">Reset</button>
            </div>
            
            <div class="control-group">
                <label for="particleCount">Particles:</label>
                <input type="range" id="particleCount" min="100" max="2000" step="100" value="1000">
                <span id="particleCountValue">1000</span>
            </div>
             
            <div class="control-group">
                <label for="flowSpeed">Flow Speed:</label>
                <input type="range" id="flowSpeed" min="0.1" max="5" step="0.1" value="1">
                <span id="flowSpeedValue">1.0</span>
            </div>
            
            <div class="control-group">
                <label for="fieldScale">Field Scale:</label>
                <input type="range" id="fieldScale" min="10" max="100" step="1" value="50">
                <span id="fieldScaleValue">50</span>
            </div>
            
            <div class="control-group">
                <button id="colorToggle" class="toggle-btn">Color Mode: Velocity</button>
                <button id="trailToggle" class="toggle-btn">Trails: ON</button>
            </div>
        </div>
    </div>
    
    <a href="../../index.html" class="back-link">Back to Game Selection</a>
    
    <script src="particle-flow.js"></script>
</body>
</html>
